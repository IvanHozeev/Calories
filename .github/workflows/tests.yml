# Прогон набора на чужой машине.
#
# Намеренно НЕ на каждый пуш. macOS-минуты в приватном репозитории
# списываются с коэффициентом десять: один прогон здесь — это около
# полутораста минут квоты, а в этом репозитории бывает по тринадцать пушей
# в сутки. Бесплатные две тысячи кончились бы за день, и дальше CI или
# молчал бы до следующего месяца, или стоил денег.
#
# Поэтому он срабатывает там, где решение действительно принимается: на
# запросе слияния в main и по кнопке. Повседневную защиту даёт хук
# Tools/pre-push, который гоняет тот же самый Tools/test.sh у себя.
name: Тесты

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Второй запрос отменяет первый: платить дважды за один и тот же ответ
  # незачем.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Образ выбран самый свежий из стандартных. Приложению нужен SDK 26 и
    # выше — на более старом образе оно не соберётся, и первым делом надо
    # смотреть в лог шага «Что на раннере»: там видно и версию Xcode, и
    # какие рантаймы симулятора вообще есть.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Отдельным шагом и до всего остального: когда прогон упадёт, первый
      # вопрос будет «а что там вообще стояло».
      - name: Что на раннере
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # Папку сборки задаём сами, иначе её знает только скрипт (через
      # TMPDIR), и шаг с артефактом ищет разбор не там, где он лежит.
      - name: Прогон
        run: Tools/test.sh
        env:
          CALORIES_DERIVED: ${{ runner.temp }}/calories-tests-dd

      # Красный прогон без разбора бесполезен: по строчке «TEST FAILED»
      # не чинят.
      - name: Разбор, если упало
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/calories-tests-dd/Logs/Test/*.xcresult
          retention-days: 7
